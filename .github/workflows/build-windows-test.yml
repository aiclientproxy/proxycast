name: Build Windows Test Package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "要构建的分支 / tag / commit SHA"
        required: false
        default: "main"
      retention_days:
        description: "Artifact 保留天数"
        required: false
        default: "7"
      n_minus_one_tag:
        description: "可选 N-1 release tag；留空时自动选择低于候选的最新稳定 tag"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-windows-test-${{ github.event.inputs.source_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=8192
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  LIME_ELECTRON_UPDATES_URL: https://updates.limecloud.com/lime/stable/win32-x64/

jobs:
  build-windows-test:
    name: Build Electron Windows x64 Squirrel installer
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Resolve source ref
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || github.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $sourceRef = $env:SOURCE_REF.Trim()
          if ([string]::IsNullOrWhiteSpace($sourceRef)) {
            throw "source_ref must not be empty"
          }
          if ($sourceRef -match '^[0-9a-fA-F]{7,39}$') {
            $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $encodedRef = [Uri]::EscapeDataString($sourceRef)
            $commit = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$encodedRef" `
              -Headers $headers
            $sourceRef = $commit.sha
          }
          "ref=$sourceRef" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.ref }}

      - name: Capture Windows test candidate identity
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(git rev-parse 'HEAD^{commit}')"
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Windows test candidate commit SHA: $CANDIDATE_SHA" >&2
            exit 1
          fi
          CANDIDATE_RUN_ID="windows-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-win32-x64"
          echo "LIME_CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "LIME_GATE_RUN_ID=$CANDIDATE_RUN_ID" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure Windows MSVC linker
        shell: pwsh
        run: ./scripts/lib/windows-msvc-linker.ps1 -Target x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lime-rs
          shared-key: windows-test-x64-electron
          cache-on-failure: true
          cache-all-crates: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Refresh sandboxed rusty_v8 artifacts
        shell: bash
        run: |
          node scripts/lib/rusty-v8-artifacts.mjs --github-env
          cargo clean --manifest-path lime-rs/Cargo.toml -p v8

      - name: Run Windows Agent Plugin path contract tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --manifest-path "lime-rs/Cargo.toml" \
            -p lime-mcp \
            --lib \
            agent_plugin_config \
            -- \
            --nocapture \
            2>&1 | tee "windows-plugin-mcp-contract-tests.log"

      - name: Prepare sherpa-onnx runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-sherpa-onnx-runtime.mjs \
            --target "x86_64-pc-windows-msvc"

      - name: Run Windows CLI and TUI current-path gates
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/lime-rs/target
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          {
            cargo test --manifest-path lime-rs/Cargo.toml -p cli -p tui
            cargo build --manifest-path lime-rs/Cargo.toml -p cli -p app-server
            npm run smoke:cli-gate-b
            npm run smoke:tui-gate-b
          } 2>&1 | tee "windows-cli-tui-gate-b.log"

      - name: Upload Windows CLI and TUI Gate B evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lime-windows-cli-tui-gate-b-evidence
          path: windows-cli-tui-gate-b.log
          if-no-files-found: error

      - name: Build Electron Windows test package with app-server and code-mode-host sidecars
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 32
          CARGO_INCREMENTAL: 0
          CARGO_TARGET_DIR: ${{ github.workspace }}/lime-rs/target
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          set -euxo pipefail
          npm run electron:build
          npx electron-forge make --platform win32 --arch x64 --targets squirrel
          VERSION="$(node -p "require('./package.json').version")"
          manifest_count="$(find release-electron -name 'desktop-resources.manifest.json' -type f | wc -l | tr -d ' ')"
          if [ "$manifest_count" -eq 0 ]; then
            echo "Electron desktop resource manifest is missing from release-electron" >&2
            exit 1
          fi
          find release-electron -name 'desktop-resources.manifest.json' -type f -print
          node scripts/electron/verify-package-resources.mjs \
            --package-root release-electron \
            --platform win32 \
            --arch x64
          node scripts/electron/stage-release-assets.mjs \
            --forge-dir release-electron \
            --out-dir windows-test-package \
            --target-triple x86_64-pc-windows-msvc \
            --version "$VERSION"

      - name: Download Windows N-1 Squirrel installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_N_MINUS_ONE_TAG: ${{ github.event.inputs.n_minus_one_tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          N_MINUS_ONE_VERSION="$({
            CANDIDATE_VERSION="$VERSION" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import {
            normalizeVersion,
            selectNMinusOneVersion,
          } from "./scripts/electron/windows-squirrel-rc-smoke.mjs";

          const requested = process.env.REQUESTED_N_MINUS_ONE_TAG?.trim();
          if (requested) {
            process.stdout.write(normalizeVersion(requested));
          } else {
            const tags = execFileSync("git", ["tag", "--list"], {
              encoding: "utf8",
            }).split(/\r?\n/);
            process.stdout.write(
              selectNMinusOneVersion({
                candidateVersion: process.env.CANDIDATE_VERSION,
                tags,
              }),
            );
          }
          NODE
          })"
          N_MINUS_ONE_TAG="v$N_MINUS_ONE_VERSION"
          mkdir -p windows-n-minus-one-package
          gh release download "$N_MINUS_ONE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Lime-$N_MINUS_ONE_VERSION.Setup.exe" \
            --dir windows-n-minus-one-package
          test -f "windows-n-minus-one-package/Lime-$N_MINUS_ONE_VERSION.Setup.exe"
          echo "N_MINUS_ONE_VERSION=$N_MINUS_ONE_VERSION" >> "$GITHUB_ENV"

      - name: Smoke installed Windows Squirrel candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/electron/windows-squirrel-rc-smoke.mjs \
            --installer-dir windows-test-package \
            --candidate-feed-dir windows-test-package \
            --evidence-dir ".lime/qc/windows-squirrel-rc/$VERSION" \
            --n-minus-one-installer-dir windows-n-minus-one-package \
            --n-minus-one-version "$N_MINUS_ONE_VERSION" \
            --version "$VERSION" \
            --candidate-sha "$LIME_CANDIDATE_SHA" \
            --run-id "$LIME_GATE_RUN_ID"

      - name: Run installed Windows Agent Plugin Gate B
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_GATE_EXECUTABLE="$(node -e "const fs=require('node:fs');const summary=JSON.parse(fs.readFileSync('.lime/qc/windows-squirrel-rc/$VERSION/summary.json','utf8'));const executable=summary.evidence?.installation?.executable;if(!executable)throw new Error('Windows Squirrel evidence is missing the installed executable');process.stdout.write(executable);")"
          CANDIDATE_RUN_ID="$(node -e "const fs=require('node:fs');const summary=JSON.parse(fs.readFileSync('.lime/qc/windows-squirrel-rc/$VERSION/summary.json','utf8'));if(!summary.candidateRunId)throw new Error('Windows Squirrel evidence is missing candidateRunId');process.stdout.write(summary.candidateRunId);")"
          export LIME_GATE_RUN_ID="$CANDIDATE_RUN_ID"
          npm run smoke:plugin-package-electron-gate-b -- \
            --electron-executable "$PLUGIN_GATE_EXECUTABLE" \
            --evidence-dir ".lime/qc/gui-evidence/plugin-package-electron-gate-b-windows" \
            --prefix "plugin-package-electron-gate-b-windows" \
            --timeout-ms 600000

      - name: Run installed Windows CodeMode Gate B
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          CODE_MODE_GATE_EXECUTABLE="$(node -e "const fs=require('node:fs');const summary=JSON.parse(fs.readFileSync('.lime/qc/windows-squirrel-rc/$VERSION/summary.json','utf8'));const executable=summary.evidence?.installation?.executable;if(!executable)throw new Error('Windows Squirrel evidence is missing the installed executable');process.stdout.write(executable);")"
          CANDIDATE_RUN_ID="$(node -e "const fs=require('node:fs');const summary=JSON.parse(fs.readFileSync('.lime/qc/windows-squirrel-rc/$VERSION/summary.json','utf8'));if(!summary.candidateRunId)throw new Error('Windows Squirrel evidence is missing candidateRunId');process.stdout.write(summary.candidateRunId);")"
          export LIME_GATE_RUN_ID="$CANDIDATE_RUN_ID"
          npm run smoke:code-mode-electron-gate-b -- \
            --electron-executable "$CODE_MODE_GATE_EXECUTABLE" \
            --output ".lime/qc/gui-evidence/code-mode-electron-gate-b-windows/code-mode-electron-gate-b-summary.json" \
            --timeout-ms 600000

      - name: Run installed Windows native host Gate B
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NATIVE_HOST_GATE_EXECUTABLE="$(node -e "const fs=require('node:fs');const summary=JSON.parse(fs.readFileSync('.lime/qc/windows-squirrel-rc/$VERSION/summary.json','utf8'));const executable=summary.evidence?.installation?.executable;if(!executable)throw new Error('Windows Squirrel evidence is missing the installed executable');process.stdout.write(executable);")"
          CANDIDATE_RUN_ID="$(node -e "const fs=require('node:fs');const summary=JSON.parse(fs.readFileSync('.lime/qc/windows-squirrel-rc/$VERSION/summary.json','utf8'));if(!summary.candidateRunId)throw new Error('Windows Squirrel evidence is missing candidateRunId');process.stdout.write(summary.candidateRunId);")"
          export LIME_GATE_RUN_ID="$CANDIDATE_RUN_ID"
          node scripts/electron/windows-native-host-gate-b.mjs \
            --electron-executable "$NATIVE_HOST_GATE_EXECUTABLE" \
            --evidence-dir ".lime/qc/gui-evidence/windows-native-host-gate-b" \
            --timeout-ms 120000

      - name: Validate Windows packaged Gate B evidence identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/electron/windows-packaged-evidence.mjs \
            --version "$VERSION" \
            --candidate-sha "$LIME_CANDIDATE_SHA" \
            --squirrel-summary ".lime/qc/windows-squirrel-rc/$VERSION/summary.json" \
            --code-mode-summary ".lime/qc/gui-evidence/code-mode-electron-gate-b-windows/code-mode-electron-gate-b-summary.json" \
            --native-host-summary ".lime/qc/gui-evidence/windows-native-host-gate-b/summary.json" \
            --output ".lime/qc/gui-evidence/windows-packaged-evidence/$VERSION/summary.json"

      - name: Uninstall Windows Squirrel candidate
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/electron/windows-squirrel-rc-smoke.mjs \
            --cleanup-summary ".lime/qc/windows-squirrel-rc/$VERSION/summary.json"

      - name: Upload Windows Squirrel RC evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lime-windows-squirrel-rc-evidence
          if-no-files-found: warn
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          path: .lime/qc/windows-squirrel-rc

      - name: Upload Windows Agent Plugin Gate B evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lime-windows-agent-plugin-gate-b-evidence
          if-no-files-found: warn
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          path: .lime/qc/gui-evidence/plugin-package-electron-gate-b-windows

      - name: Upload Windows CodeMode Gate B evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lime-windows-code-mode-gate-b-evidence
          if-no-files-found: warn
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          path: .lime/qc/gui-evidence/code-mode-electron-gate-b-windows

      - name: Upload Windows native host Gate B evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lime-windows-native-host-gate-b-evidence
          if-no-files-found: warn
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          path: .lime/qc/gui-evidence/windows-native-host-gate-b

      - name: Upload Windows packaged Gate B evidence identity
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lime-windows-packaged-evidence
          if-no-files-found: warn
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          path: .lime/qc/gui-evidence/windows-packaged-evidence

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: lime-electron-windows-test-x64
          if-no-files-found: error
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          path: windows-test-package/*

      - name: Upload Windows Agent Plugin path contract log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lime-windows-agent-plugin-path-contract-tests
          if-no-files-found: warn
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          path: windows-plugin-mcp-contract-tests.log
