[package]
name = "tool-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "tool_runtime"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "code-mode-host"
path = "src/bin/code-mode-host.rs"

[[bin]]
name = "windows-sandbox-setup"
path = "src/bin/windows-sandbox-setup.rs"

[[bin]]
name = "windows-sandbox-runner"
path = "src/bin/windows-sandbox-runner.rs"

[dependencies]
agent-protocol.workspace = true
app-server-protocol.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
deno_core_icudata.workspace = true
dirs.workspace = true
document-preview.workspace = true
encoding_rs = "0.8"
futures.workspace = true
glob.workspace = true
hex.workspace = true
jsonschema.workspace = true
lime-core.workspace = true
lime-skills.workspace = true
patch-apply.workspace = true
portable-pty.workspace = true
rmcp.workspace = true
regex.workspace = true
reqwest.workspace = true
scraper = "0.20"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiktoken-rs.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
toml_edit.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid.workspace = true
v8.workspace = true
which = "8.0.0"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Rpc",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }
